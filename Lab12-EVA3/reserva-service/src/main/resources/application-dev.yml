# Ambiente de desarrollo: base local, crea/actualiza tablas y muestra el SQL
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_reserva?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Direcciones de los otros microservicios
servicios:
  huesped:
    url: ${HUESPED_URL:http://localhost:8081}
  habitacion:
    url: ${HABITACION_URL:http://localhost:8082}
